{% extends 'base.html' %}
{% load static %}

{% block title %}Cart{% endblock %}

{% block content %}
<section class="section cart-section">
    <div class="section-header">
        <p class="section-tag">Your Cart</p>
        <h2 class="section-title">Shopping Cart</h2>
    </div>

    <div class="cart-container">
        <div class="cart-items" id="cartItems">
            <div class="loading">Loading cart...</div>
        </div>

        <div class="cart-summary" id="cartSummary">
            <!-- Summary loaded via JS -->
        </div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
    .cart-section {
        padding-top: 120px;
        min-height: 100vh;
    }

    .cart-container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 40px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .cart-items {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 30px;
    }

    .cart-item {
        display: flex;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-item:last-child {
        border-bottom: none;
    }

    .cart-item-img {
        width: 80px;
        height: 80px;
        background: #111;
        border-radius: 8px;
        object-fit: cover;
    }

    .cart-item-info {
        flex: 1;
    }

    .cart-item-name {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .cart-item-price {
        color: var(--vaidya-gold);
        font-weight: 600;
    }

    .cart-item-qty {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }

    .qty-btn {
        width: 30px;
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: transparent;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
    }

    .cart-item-remove {
        color: #ff6b6b;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .cart-summary {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 30px;
        height: fit-content;
        position: sticky;
        top: 100px;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
    }

    .summary-total {
        font-size: 1.3rem;
        font-weight: 700;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 15px;
        margin-top: 15px;
    }

    .checkout-btn {
        width: 100%;
        margin-top: 20px;
    }

    .empty-cart {
        text-align: center;
        padding: 50px;
        color: rgba(255, 255, 255, 0.5);
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    async function loadCart() {
        try {
            const response = await fetch('/api/orders/cart/');
            if (response.status === 401) {
                window.location.href = '/login/';
                return;
            }
            const cart = await response.json();
            renderCart(cart);
        } catch (error) {
            document.getElementById('cartItems').innerHTML = '<div class="empty-cart">Error loading cart</div>';
        }
    }

    function renderCart(cart) {
        const itemsEl = document.getElementById('cartItems');
        const summaryEl = document.getElementById('cartSummary');

        if (!cart.items || cart.items.length === 0) {
            itemsEl.innerHTML = '<div class="empty-cart">Your cart is empty. <a href="/catalog/">Browse medicines</a></div>';
            summaryEl.innerHTML = '';
            return;
        }

        itemsEl.innerHTML = cart.items.map(item => `
        <div class="cart-item">
            <img src="${item.medicine.image || '/static/images/medicine-placeholder.png'}" class="cart-item-img">
            <div class="cart-item-info">
                <h4 class="cart-item-name">${item.medicine.name}</h4>
                <p class="cart-item-price">₹${item.medicine.price} each</p>
                <div class="cart-item-qty">
                    <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>
                    <span>${item.quantity}</span>
                    <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                    <span class="cart-item-remove" onclick="removeItem(${item.id})">Remove</span>
                </div>
            </div>
            <div class="cart-item-subtotal">₹${item.subtotal}</div>
        </div>
    `).join('');

        const delivery = cart.total_amount >= 500 ? 0 : 50;
        const total = parseFloat(cart.total_amount) + delivery;

        let discountHtml = '';
        let couponInputHtml = `
            <div class="coupon-section" style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1)">
                <div style="display:flex;gap:10px">
                    <input type="text" id="couponCode" placeholder="Coupon Code" style="flex:1;background:rgba(255,255,255,0.1);border:1px solid var(--glass-border);color:white;padding:8px;border-radius:4px">
                    <button class="btn-primary" onclick="applyCoupon()" style="padding:8px 15px;font-size:0.9rem;min-width:80px">Apply</button>
                </div>
                <p id="couponMsg" style="font-size:0.8rem;margin-top:5px"></p>
            </div>
        `;

        if (cart.coupon_code) {
            discountHtml = `<div class="summary-row" style="color:var(--vaidya-gold)">
                <span>Discount (${cart.coupon_code})</span>
                <span>-₹${cart.discount_amount} <small style="cursor:pointer;color:#ff6b6b;margin-left:5px" onclick="removeCoupon()">[Remove]</small></span>
             </div>`;
            couponInputHtml = ''; // Hide input if applied
        }

        summaryEl.innerHTML = `
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span>₹${cart.subtotal}</span></div>
        ${discountHtml}
        <div class="summary-row"><span>Delivery</span><span>${delivery === 0 ? 'FREE' : '₹' + delivery}</span></div>
        <div class="summary-row summary-total"><span>Total</span><span>₹${total.toFixed(2)}</span></div>
        <button class="btn-primary checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
        ${couponInputHtml}
        <p style="text-align:center;margin-top:10px;font-size:0.8rem;color:rgba(255,255,255,0.5)">Free delivery on orders above ₹500</p>
    `;
    }

    async function updateQty(itemId, newQty) {
        if (newQty < 1) { removeItem(itemId); return; }
        await fetch(`/api/orders/cart/item/${itemId}/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ quantity: newQty })
        });
        loadCart();
    }

    async function removeItem(itemId) {
        await fetch(`/api/orders/cart/item/${itemId}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        loadCart();
    }

    async function applyCoupon() {
        const code = document.getElementById('couponCode').value;
        const msgEl = document.getElementById('couponMsg');
        if (!code) return;

        msgEl.innerText = 'Applying...';
        const res = await fetch('/api/orders/apply-coupon/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
            body: JSON.stringify({ code: code })
        });
        const data = await res.json();
        if (res.ok) {
            loadCart(); // Reload to show discount
        } else {
            msgEl.innerText = data.error || 'Failed to apply coupon';
            msgEl.style.color = '#ff6b6b';
        }
    }

    async function removeCoupon() {
        await fetch('/api/orders/remove-coupon/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        loadCart();
    }

    function goToCheckout() { window.location.href = '/dashboard/?checkout=true'; }
    function getCookie(name) { return document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1]; }

    loadCart();
</script>
{% endblock %}
