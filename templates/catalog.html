{% extends 'base.html' %}
{% load static %}

{% block title %}Medicines{% endblock %}

{% block content %}
<section class="section catalog-section">

    <!-- Search & Filters -->
    <div class="catalog-controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search medicines...">
        </div>
        <div class="filter-box">
            <button id="searchBtn" class="search-btn">Search</button>
            <select id="sortFilter">
                <option value="name">Sort by Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="discount">Best Discount</option>
                <option value="platform">Platform A-Z</option>
            </select>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">
        <!-- Products loaded via JS -->
        <div class="loading">Loading medicines...</div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
    .catalog-section {
        padding-top: 180px;
        min-height: 100vh;
    }

    .catalog-controls {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        max-width: 1200px;
        margin: 0 auto 40px;
    }

    .search-box {
        flex: 1;
    }

    .search-box input {
        width: 100%;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #fff;
        font-size: 1rem;
    }

    .filter-box {
        display: flex;
        gap: 15px;
    }

    .filter-box select {
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #fff;
        font-size: 0.9rem;
    }

    .filter-box select option {
        background: #1a1a1a;
        color: #fff;
    }

    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
        align-content: start;
    }

    .product-card {
        background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.3s;
        display: flex;
        flex-direction: column;
    }

    .product-card:hover {
        transform: translateY(-5px);
        border-color: var(--vaidya-gold);
    }

    .product-img {
        width: 100%;
        height: 200px;
        object-fit: contain;
        background: #ffffff;
        padding: 10px;
        box-sizing: border-box;
    }

    .product-info {
        padding: 25px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .product-name {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .product-manufacturer {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        margin-bottom: 15px;
    }

    .product-price {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .price-current {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--vaidya-gold);
    }

    .price-mrp {
        text-decoration: line-through;
        color: rgba(255, 255, 255, 0.4);
    }

    .price-save {
        background: rgba(0, 255, 0, 0.2);
        color: #69db7c;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
    }

    .search-btn {
        padding: 15px 35px;
        background: var(--vaidya-gold);
        border: none;
        border-radius: 8px;
        color: #000;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
    }

    .search-btn:hover {
        background: #e6a800;
        transform: scale(1.03);
    }

    .add-to-cart-btn {
        width: 100%;
        padding: 12px;
        background: transparent;
        border: 1px solid var(--vaidya-gold);
        color: var(--vaidya-gold);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: auto;
    }

    .add-to-cart-btn:hover {
        background: var(--vaidya-gold);
        color: #000;
    }

    .loading {
        grid-column: 1 / -1;
        text-align: center;
        padding: 50px;
        color: rgba(255, 255, 255, 0.5);
    }

    .prescription-badge {
        background: rgba(255, 100, 100, 0.2);
        color: #ff6b6b;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        margin-left: 10px;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    let allMedicines = [];
    let categories = [];
    let searchTimeout = null;

    async function loadMedicines() {
        try {
            const response = await fetch('/api/medicines/');
            allMedicines = await response.json();
            renderMedicines(allMedicines);
        } catch (error) {
            document.getElementById('productsGrid').innerHTML = '<div class="loading">Error loading medicines</div>';
        }
    }

    let lastExternalResults = [];

    function parsePrice(str) {
        if (!str) return Infinity;
        const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
        return isNaN(num) ? Infinity : num;
    }

    function parseDiscount(str) {
        if (!str) return 0;
        const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
        return isNaN(num) ? 0 : num;
    }

    function sortResults(results) {
        const sortBy = document.getElementById('sortFilter').value;
        const sorted = [...results];
        switch (sortBy) {
            case 'name':
                sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                break;
            case 'price-low':
                sorted.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
                break;
            case 'price-high':
                sorted.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
                break;
            case 'discount':
                sorted.sort((a, b) => parseDiscount(b.discount) - parseDiscount(a.discount));
                break;
            case 'platform':
                sorted.sort((a, b) => (a.source_site || '').localeCompare(b.source_site || ''));
                break;
        }
        return sorted;
    }

    function doSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const grid = document.getElementById('productsGrid');

        // Filter local medicines immediately
        const filtered = allMedicines.filter(med =>
            med.name.toLowerCase().includes(query) ||
            (med.manufacturer && med.manufacturer.toLowerCase().includes(query))
        );

        let htmlStr = '';
        if (filtered.length > 0) {
            htmlStr = renderMedicines(filtered, false);
        } else if (query.length <= 2) {
            htmlStr = '<div class="loading">Type a medicine name and click Search</div>';
        }

        if (query.length > 2) {
            htmlStr += `
            <div style="grid-column: 1 / -1; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <h3 style="color: var(--vaidya-gold); margin-bottom: 20px;">Live Market Results</h3>
                <div id="externalResultsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
                    <div class="loading">Searching across platforms (1mg, PharmEasy...)...</div>
                </div>
            </div>`;
        }
        grid.innerHTML = htmlStr;

        // Fetch external results
        if (query.length > 2) {
            (async () => {
                const externalGrid = document.getElementById('externalResultsGrid');
                try {
                    const response = await fetch(`/api/search/external/live/?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        lastExternalResults = data.results;
                        const sorted = sortResults(lastExternalResults);
                        externalGrid.innerHTML = renderMedicines(sorted, true);
                    } else {
                        lastExternalResults = [];
                        externalGrid.innerHTML = '<div class="loading">No external results found</div>';
                    }
                } catch (err) {
                    console.error("External search failed:", err);
                    lastExternalResults = [];
                    if (externalGrid) externalGrid.innerHTML = '<div class="loading">Live search unavailable.</div>';
                }
            })();
        }
    }

    function renderMedicines(medicines, isExternal = false) {
        let html = '';
        if (medicines.length === 0) {
            html = '<div class="loading">No medicines found</div>';
        } else {
            html = medicines.map(med => {
                const placeholderImg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiBmaWxsPSIjZjhmOWY5Ij48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIvPjxwYXRoIGQ9Ik0xMDAgMTM0YTMyIDMyIDAgMSAxIDAtNjQgMzIgMzIgMCAwIDEgMCA2NHptMC01NmEyNCAyNCAwIDEgMCAwIDQ4IDI0IDI0IDAgMCAwIDAtNDh6IiBmaWxsPSIjY2RjZWNlIi8+PC9zdmc+";
                const img = med.image || med.image_url || placeholderImg;
                const name = med.name;
                const mfg = med.manufacturer || med.source_site || '';
                const price = med.price ? String(med.price).replace(/[^0-9.]/g, '') : '0';
                const mrp = med.mrp ? String(med.mrp).replace(/[^0-9.]/g, '') : price;
                const savings = (parseFloat(mrp) - parseFloat(price)).toFixed(1);
                const showSave = savings > 0;

                const ctaBtn = isExternal
                    ? `<a href="${med.source_url}" target="_blank" class="add-to-cart-btn" style="text-align:center; display:block; text-decoration:none;">View on ${med.source_site}</a>`
                    : `<button class="add-to-cart-btn" onclick="addToCart(${med.id})">${med.in_stock !== false ? 'Add to Cart' : 'Out of Stock'}</button>`;

                return `
                <div class="product-card" style="${isExternal ? 'border-color: #69db7c;' : ''}">
                    <img src="${img}" alt="${name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-name">
                            ${name}
                            ${med.requires_prescription ? '<span class="prescription-badge">Rx</span>' : ''}
                        </h3>
                        <p class="product-manufacturer">${mfg}</p>
                        <div class="product-price">
                            <span class="price-current">₹${price}</span>
                            ${mrp > price ? `<span class="price-mrp">₹${mrp}</span>` : ''}
                            ${showSave ? `<span class="price-save">Save ₹${savings}</span>` : ''}
                        </div>
                        ${ctaBtn}
                    </div>
                </div>
                `;
            }).join('');
        }
        return html;
    }

    async function addToCart(medicineId) {
        try {
            const response = await fetch('/api/orders/cart/add/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ medicine_id: medicineId, quantity: 1 })
            });

            if (response.ok) {
                alert('Added to cart!');
            } else if (response.status === 401) {
                window.location.href = '/login/';
            } else {
                const data = await response.json();
                alert(data.error || 'Failed to add to cart');
            }
        } catch (error) {
            alert('Error adding to cart');
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Search on button click
    document.getElementById('searchBtn').addEventListener('click', doSearch);

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch();
    });

    // Re-sort when sort dropdown changes
    document.getElementById('sortFilter').addEventListener('change', function () {
        const externalGrid = document.getElementById('externalResultsGrid');
        if (externalGrid && lastExternalResults.length > 0) {
            const sorted = sortResults(lastExternalResults);
            externalGrid.innerHTML = renderMedicines(sorted, true);
        }
    });

    // Load on page load
    loadMedicines();
</script>
{% endblock %}
