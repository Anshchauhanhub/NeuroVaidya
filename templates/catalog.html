{% extends 'base.html' %}
{% load static %}

{% block title %}Medicines{% endblock %}

{% block content %}
<section class="section-padding" style="padding-top: 140px;">
    <div class="container">
        <!-- Search & Filters - Vanilla Premium -->
        <div class="glass-card reveal" style="margin-bottom: 4rem; display: flex; gap: 1.5rem; align-items: center; padding: 1.5rem;">
            <div style="flex: 1; position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search medicines, health needs, or brands..." 
                       style="width: 100%; background: hsla(0,0%,100%,0.03); border: 1px solid var(--glass-border); border-radius: 15px; padding: 1.2rem 1.2rem 1.2rem 4rem; color: #fff; font-size: 1.1rem; outline: none; transition: var(--transition-medium);">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <select id="sortFilter" style="background: hsla(0,0%,100%,0.03); border: 1px solid var(--glass-border); color: #fff; border-radius: 12px; padding: 0 1.5rem; font-family: inherit; cursor: pointer; outline: none;">
                    <option value="name">Sort by Name</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="discount">Best Discount</option>
                </select>
                <button id="searchBtn" class="nv-btn nv-btn-primary" style="padding: 1rem 2.5rem;">Search</button>
            </div>
        </div>

        <!-- Products Grid Container -->
        <div id="productsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2.5rem;">
            <!-- Products loaded via JS -->
            <div class="loading reveal" style="grid-column: 1 / -1; text-align: center; padding: 5rem; color: var(--text-muted); font-size: 1.2rem;">
                <p>Initializing Pharmacy Brain...</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_css %}
<style>
    #searchInput:focus {
        border-color: var(--accent-primary);
        background: hsla(0,0%,100%,0.06);
        box-shadow: 0 0 20px hsla(var(--h-cyan), 0.1);
    }
    
    #sortFilter option {
        background: var(--bg-surface);
        padding: 10px;
    }

    /* Override dynamic loaded card styles to match system */
    .catalog-product-card {
        transition: var(--transition-medium);
    }
    
    .external-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        background: hsla(var(--h-cyan), 0.2);
        color: var(--accent-primary);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 800;
        border: 1px solid hsla(var(--h-cyan), 0.3);
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    let allMedicines = [];
    let categories = [];
    let searchTimeout = null;

    async function loadMedicines() {
        try {
            const response = await fetch('/api/medicines/');
            allMedicines = await response.json();
            renderMedicines(allMedicines);
        } catch (error) {
            document.getElementById('productsGrid').innerHTML = '<div class="loading">Error loading medicines</div>';
        }
    }

    let lastExternalResults = [];

    function parsePrice(str) {
        if (!str) return Infinity;
        const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
        return isNaN(num) ? Infinity : num;
    }

    function parseDiscount(str) {
        if (!str) return 0;
        const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
        return isNaN(num) ? 0 : num;
    }

    function sortResults(results) {
        const sortBy = document.getElementById('sortFilter').value;
        const sorted = [...results];
        switch (sortBy) {
            case 'name':
                sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                break;
            case 'price-low':
                sorted.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
                break;
            case 'price-high':
                sorted.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
                break;
            case 'discount':
                sorted.sort((a, b) => parseDiscount(b.discount) - parseDiscount(a.discount));
                break;
            case 'platform':
                sorted.sort((a, b) => (a.source_site || '').localeCompare(b.source_site || ''));
                break;
        }
        return sorted;
    }

    function doSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const grid = document.getElementById('productsGrid');

        // Filter local medicines immediately
        const filtered = allMedicines.filter(med =>
            med.name.toLowerCase().includes(query) ||
            (med.manufacturer && med.manufacturer.toLowerCase().includes(query))
        );

        let htmlStr = '';
        if (filtered.length > 0) {
            htmlStr = renderMedicines(filtered, false);
        } else if (query.length <= 2) {
            htmlStr = '<div class="loading">Type a medicine name and click Search</div>';
        }

        if (query.length > 2) {
            htmlStr += `
            <div style="grid-column: 1 / -1; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <h3 style="color: var(--vaidya-gold); margin-bottom: 20px;">Live Market Results</h3>
                <div id="externalResultsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
                    <div class="loading">Searching across platforms (1mg, PharmEasy...)...</div>
                </div>
            </div>`;
        }
        grid.innerHTML = htmlStr;

        // Fetch external results
        if (query.length > 2) {
            (async () => {
                const externalGrid = document.getElementById('externalResultsGrid');
                const cacheKey = `search_cache_${query}`;
                const cacheExpiry = 4 * 60 * 60 * 1000; // 4 hours in ms
                
                // 1. Check LocalStorage Cache
                const cachedData = localStorage.getItem(cacheKey);
                if (cachedData) {
                    try {
                        const parsed = JSON.parse(cachedData);
                        const now = new Date().getTime();
                        if (now - parsed.timestamp < cacheExpiry) {
                            console.log(`DEBUG: Serving results for '${query}' from LocalStorage`);
                            lastExternalResults = parsed.results;
                            const sorted = sortResults(lastExternalResults);
                            externalGrid.innerHTML = renderMedicines(sorted, true);
                            
                            // Add a little "Cached" badge or just return
                            return;
                        }
                    } catch (e) {
                        localStorage.removeItem(cacheKey);
                    }
                }

                try {
                    console.log(`DEBUG: Fetching live results for '${query}'...`);
                    const response = await fetch(`/api/search/external/live/?q=${encodeURIComponent(query)}`);
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.details || `HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log(`DEBUG: API response received:`, data);
                    
                    if (data.results && data.results.length > 0) {
                        lastExternalResults = data.results;
                        const sorted = sortResults(lastExternalResults);
                        const html = renderMedicines(sorted, true);
                        console.log(`DEBUG: Rendered HTML length: ${html.length}`);
                        externalGrid.innerHTML = html;
                        
                        // 2. Save to LocalStorage Cache
                        const cacheEntry = {
                            timestamp: new Date().getTime(),
                            results: data.results
                        };
                        localStorage.setItem(cacheKey, JSON.stringify(cacheEntry));
                    } else if (data.error) {
                         throw new Error(data.error + (data.details ? ": " + data.details : ""));
                    } else {
                        lastExternalResults = [];
                        externalGrid.innerHTML = '<div class="loading">No external results found</div>';
                    }
                } catch (err) {
                    console.error("External search failed:", err);
                    lastExternalResults = [];
                    if (externalGrid) externalGrid.innerHTML = `<div class="loading">Live search unavailable. <br><small style="color:rgba(255,100,100,0.7)">Error: ${err.message}</small></div>`;
                }
            })();
        }
    }

    function renderMedicines(medicines, isExternal = false) {
        let html = '';
        if (medicines.length === 0) {
            html = '<div class="loading reveal">No results found in neuro-database.</div>';
        } else {
            html = medicines.map(med => {
                const placeholderImg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiBmaWxsPSIjZjhmOWY5Ij48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIvPjxwYXRoIGQ9Ik0xMDAgMTM0YTMyIDMyIDAgMSAxIDAtNjQgMzIgMzIgMCAwIDEgMCA2NHptMC01NmEyNCAyNCAwIDEgMCAwIDQ4IDI0IDI0IDAgMCAwIDAtNDh6IiBmaWxsPSIjY2RjZWNlIi8+PC9zdmc+";
                const img = med.image || med.image_url || placeholderImg;
                const price = med.price ? String(med.price).replace(/[^0-9.]/g, '') : '0';
                const mrp = med.mrp ? String(med.mrp).replace(/[^0-9.]/g, '') : price;
                const savings = (parseFloat(mrp) - parseFloat(price)).toFixed(1);

                const ctaBtn = isExternal
                    ? `<a href="${med.source_url}" target="_blank" class="nv-btn nv-btn-outline" style="width: 100%; margin-top: 1.5rem; text-decoration: none;">View on ${med.source_site}</a>`
                    : `<button class="nv-btn nv-btn-primary" style="width: 100%; margin-top: 1.5rem;" onclick="addToCart(${med.id})">${med.in_stock !== false ? 'Add to Cart' : 'Out of Stock'}</button>`;

                return `
                <div class="glass-card reveal catalog-product-card" style="padding: 0; overflow: hidden; position: relative; display: flex; flex-direction: column;">
                    ${isExternal ? `<div class="external-badge">${med.source_site}</div>` : ''}
                    <div style="height: 220px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 2rem;">
                        <img src="${img}" alt="${med.name}" style="height: 100%; width: 100%; object-fit: contain;">
                    </div>
                    <div style="padding: 2rem; flex: 1; display: flex; flex-direction: column;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px;">
                            ${med.name}
                            ${med.requires_prescription ? '<span style="background: hsla(0, 100%, 70%, 0.15); color: #ff6b6b; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; border: 1px solid hsla(0, 100%, 70%, 0.2);">Rx</span>' : ''}
                        </h3>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">${med.manufacturer || med.source_site || 'NeuroVaidya Care'}</p>
                        
                        <div style="margin-top: auto; display: flex; align-items: baseline; gap: 10px;">
                            <span style="font-size: 1.75rem; font-weight: 800; color: var(--accent-secondary);">₹${price}</span>
                            ${mrp > price ? `<span style="text-decoration: line-through; color: var(--text-muted); font-size: 1rem;">₹${mrp}</span>` : ''}
                        </div>
                        ${savings > 0 ? `<div style="color: #69db7c; font-size: 0.8rem; font-weight: 700; margin-top: 5px;">Save ₹${savings}</div>` : ''}
                        
                        ${ctaBtn}
                    </div>
                </div>
                `;
            }).join('');
        }
        return html;
    }

    async function addToCart(medicineId) {
        try {
            const response = await fetch('/api/orders/cart/add/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ medicine_id: medicineId, quantity: 1 })
            });

            if (response.ok) {
                alert('Added to cart!');
            } else if (response.status === 401) {
                window.location.href = '/login/';
            } else {
                const data = await response.json();
                alert(data.error || 'Failed to add to cart');
            }
        } catch (error) {
            alert('Error adding to cart');
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Search on button click
    document.getElementById('searchBtn').addEventListener('click', doSearch);

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch();
    });

    // Re-sort when sort dropdown changes
    document.getElementById('sortFilter').addEventListener('change', function () {
        const externalGrid = document.getElementById('externalResultsGrid');
        if (externalGrid && lastExternalResults.length > 0) {
            const sorted = sortResults(lastExternalResults);
            externalGrid.innerHTML = renderMedicines(sorted, true);
        }
    });

    // Load on page load
    loadMedicines();
</script>
{% endblock %}
